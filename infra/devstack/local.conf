# DevStack all-in-one cho đồ án IT5404 (OpenStack stable/2026.2, Ubuntu 24.04 arm64, OVN)
[[local|localrc]]
ADMIN_PASSWORD=secret
DATABASE_PASSWORD=$ADMIN_PASSWORD
RABBIT_PASSWORD=$ADMIN_PASSWORD
SERVICE_PASSWORD=$ADMIN_PASSWORD

HOST_IP=192.168.64.2
GIT_BASE=https://opendev.org
TARGET_BRANCH=stable/2026.2
NOVA_BRANCH=$TARGET_BRANCH
NEUTRON_BRANCH=$TARGET_BRANCH
GLANCE_BRANCH=$TARGET_BRANCH
KEYSTONE_BRANCH=$TARGET_BRANCH
HORIZON_BRANCH=$TARGET_BRANCH
PLACEMENT_BRANCH=$TARGET_BRANCH
REQUIREMENTS_BRANCH=$TARGET_BRANCH

# Chỉ giữ dịch vụ tối thiểu: Keystone, Nova, Placement, Neutron(OVN), Glance, Horizon
disable_service c-api c-sch c-vol c-bak tempest dstat
enable_service horizon

# Mạng external (floating IP) – host được devstack gán 172.24.4.1 trên br-ex
FLOATING_RANGE=172.24.4.0/24
PUBLIC_NETWORK_GATEWAY=172.24.4.1
Q_FLOATING_ALLOCATION_POOL=start=172.24.4.10,end=172.24.4.250
FIXED_RANGE=10.0.0.0/24

LIBVIRT_TYPE=kvm
LOGFILE=/opt/stack/logs/stack.sh.log
LOG_COLOR=False

[[post-config|$NOVA_CONF]]
[libvirt]
cpu_mode = host-passthrough
[DEFAULT]
# aarch64: Nova không có DMI "OpenStack Nova" -> ds-identify tắt cloud-init; config drive giúp cloud-init luôn chạy
force_config_drive = True
# cho phép overcommit nhẹ để chạy 4–5 VM app
cpu_allocation_ratio = 4.0
ram_allocation_ratio = 1.5
