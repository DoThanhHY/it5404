# Lima VM chạy DevStack all-in-one trên Mac Apple Silicon (M3+ / macOS 15+).
# Tạo:  limactl start --name=openstack infra/lima/openstack-host.yaml
vmType: vz
nestedVirtualization: true      # cần /dev/kvm trong VM để Nova chạy KVM thay vì QEMU giả lập
arch: aarch64
cpus: 8
memory: 16GiB
disk: 120GiB
images:
  - location: "https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: aarch64
mounts:
  - location: "~/dientoandammay"
    writable: true
networks:
  # vzNAT cấp cho VM một IP 192.168.64.x mà Mac truy cập trực tiếp được (Horizon, Grafana...)
  - vzNAT: true
containerd:
  system: false
  user: false
provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install -y git cpu-checker qemu-efi-aarch64 libguestfs-tools jq python3-venv haproxy
      # user 'stack' cho DevStack
      id stack || useradd -s /bin/bash -d /opt/stack -m stack
      chmod +x /opt/stack
      echo "stack ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/stack
      # cho phép libguestfs đọc kernel (virt-customize)
      chmod 0644 /boot/vmlinuz* || true
