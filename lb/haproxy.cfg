# HAProxy – load balancer cho nhóm VM app. Backend dùng server-template (10 slot trống);
# autoscaler điền IP / bật / drain từng slot qua Runtime API (socket admin 127.0.0.1:9999), không cần reload.
global
    log /dev/log local0
    stats socket ipv4@127.0.0.1:9999 level admin expose-fd listeners
    stats socket /run/haproxy/admin.sock mode 660 level admin
    maxconn 4096

defaults
    mode http
    log global
    option httplog
    timeout connect 3s
    timeout client  30s
    timeout server  30s
    retries 2
    option redispatch

frontend web
    bind *:8888
    default_backend app

frontend metrics
    bind *:8405
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 5s

backend app
    balance leastconn
    option httpchk GET /actuator/health/readiness
    http-check expect status 200
    default-server inter 2s fall 2 rise 1 slowstart 10s
    server-template app 1-10 0.0.0.0:8080 check disabled
